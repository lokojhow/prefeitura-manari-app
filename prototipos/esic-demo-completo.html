<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-SIC Manari — demonstração integrada</title><style>*{box-sizing:border-box}body{font:14px Arial,sans-serif;background:#f5f8fa;color:#234;margin:0}header{background:linear-gradient(110deg,#0c4876,#168c85);color:white;padding:26px 5%}main{max-width:940px;margin:auto;padding:22px}section{background:white;border:1px solid #dee7ed;border-radius:14px;padding:22px;margin-bottom:18px}h1{margin:5px 0}label{display:block;font-weight:bold;margin-top:12px}input,textarea,select{width:100%;padding:12px;border:1px solid #bacbd7;border-radius:8px;margin-top:5px}textarea{min-height:90px}button{background:#0d507b;border:0;border-radius:8px;padding:12px 18px;color:white;font-weight:bold;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}.badge{display:inline-block;background:#ffedc0;color:#653f02;padding:8px 12px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pedido{padding:12px 0;border-bottom:1px solid #dce6ed}small{color:#657b8c}#msg,#log{min-height:30px;white-space:pre-wrap}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header><small style="color:#b9e9e1">PREFEITURA DE MANARI • ESIC</small><h1>Demonstração integrada</h1><p>Simulação de solicitação, encaminhamento e resposta.</p><span class="badge">SIMULAÇÃO — não envia dados ao portal</span></header><main><div class="grid"><section><h2>Área do cidadão</h2><form id="form"><label>Nome<input name="nome" required value="Pessoa Exemplo"></label><label>E-mail<input name="email" type="email" required value="exemplo@example.test"></label><label>Assunto<input name="assunto" minlength="5" required value="Informações de obras"></label><label>Pedido<textarea name="descricao" minlength="10" required>Solicito informações públicas sobre uma obra municipal.</textarea></label><button>Registrar pedido simulado</button></form><p id="msg" role="status"></p><h3>Meus pedidos simulados</h3><div id="meus"></div></section><section><h2>Área do servidor</h2><p>Somente dados fictícios desta página.</p><label>Pedido<select id="pedido"></select></label><label>Encaminhar para<select id="setor"><option value="Obras e Infraestrutura">Obras e Infraestrutura</option><option value="Saúde">Saúde</option><option value="Educação">Educação</option></select></label><button id="encaminhar" type="button">Encaminhar</button><label>Resposta<textarea id="resposta">Informações disponíveis para consulta em caráter demonstrativo.</textarea></label><button id="responder" type="button">Registrar resposta</button><p id="log" role="status"></p><h3>Fila de atendimento</h3><div id="fila"></div></section></div></main><script type="module">
import {criarDemoEsic} from './esic-demo-integrado.js';
const svc=criarDemoEsic(),$=id=>document.getElementById(id);
function linha(p){const d=document.createElement('div');d.className='pedido';const b=document.createElement('b');b.textContent=p.subject;const s=document.createElement('p');s.textContent=p.protocol+' • '+p.status+(p.department?' • '+p.department:'');const a=document.createElement('small');a.textContent=p.response_text||'Sem resposta até o momento.';d.append(b,s,a);return d;}
async function atualizar(){const ps=await svc.fila();$('fila').replaceChildren(...ps.map(linha));$('meus').replaceChildren(...ps.map(linha));$('pedido').replaceChildren(...ps.map(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.protocol;return o;}));}
$('form').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const p=await svc.solicitar(Object.fromEntries(new FormData(e.target)));$('msg').textContent='Protocolo simulado: '+p.protocol;await atualizar();}catch(err){$('msg').textContent=err.message;}finally{b.disabled=false;}});
for(const op of ['encaminhar','responder']){$(op).addEventListener('click',async()=>{const b=$(op);b.disabled=true;try{const id=$('pedido').value;if(!id)throw new Error('Crie primeiro uma solicitação simulada.');const p=op==='encaminhar'?await svc.encaminhar(id,$('setor').value):await svc.responder(id,$('resposta').value);$('log').textContent=p.protocol+' atualizado: '+p.status;await atualizar();}catch(err){$('log').textContent=err.message;}finally{b.disabled=false;}});}
</script></body></html>
